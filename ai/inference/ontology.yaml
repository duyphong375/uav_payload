hardware_contract_profile:
  status: "DESIGN_PENDING_G1_ABI"
  description: "Mapping dữ liệu/model 2 lớp. Khả năng GoAI, vị trí wire bit và gói Telemetry 32-byte chưa được xác minh hoặc phê duyệt G1."
  classes:
    - id: 0
      name: person
      wire_id: 1
      wire_id_status: "PROPOSED_PENDING_G1_ABI"
      definition: "Người thật nhìn thấy được trên mặt nước, thuyền hoặc bờ; vật mẫu/mannequin phải được ghi và đánh giá riêng theo ontology."
      annotate: "BBox ôm sát phần nhìn thấy; không đoán phần chìm."
    - id: 1
      name: lifebuoy
      wire_id: 2
      wire_id_status: "PROPOSED_PENDING_G1_ABI"
      definition: "Phao cứu sinh hình vòng hoặc móng ngựa."
      annotate: "Không gộp phao đánh dấu/phao neo biển, lốp xe hoặc vật nổi khác."
  hard_negative_ratio_target: "20% - 30% ảnh âm tính là mục tiêu; phải đo báo động giả trên dữ liệu đã QA."
  empirical_dataset_distribution:
    status: "NOT_VERIFIED_FOR_RELEASE"
    class_imbalance_ratio: null
    negative_ratio_current: null
    evidence_note: "Phải tái lập từ input/version đã khóa và QA ngữ nghĩa; không dùng số liệu lịch sử trong ontology làm release evidence."
    evaluation_protocol: "BẮT BUỘC báo cáo metric độc lập theo từng lớp (Per-Class Precision, Recall, mAP50, mAP50-95); không đánh giá chung mAP all để tránh thiên lệch do person áp đảo."

