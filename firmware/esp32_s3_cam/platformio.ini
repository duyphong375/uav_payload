; PlatformIO Project Configuration — KVC ESP32-S3-CAM (IF-05)
;
; Camera quan sát phụ. Thiết bị này KHÔNG sinh toạ độ (quyết định H1).
;
; Build:  pio run -d firmware/esp32_s3_cam
; Nạp:    pio run -d firmware/esp32_s3_cam -t upload --upload-port COMx
; Serial: pio device monitor -d firmware/esp32_s3_cam --port COMx

[env:esp32-s3-cam]
platform = espressif32
framework = arduino

; N16R8: 16 MB flash quad + 8 MB PSRAM octal. PSRAM là bắt buộc để có
; fb_count = 3 (xem include/kvc_config.h).
board = esp32-s3-devkitc1-n16r8
board_build.flash_mode = qio
board_build.psram_type = opi

; 240 MHz: giữ nguyên để đủ băng thông xử lý 3 framebuffer VGA JPEG.
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0

lib_deps =
    https://github.com/espressif/esp32-camera.git#v2.0.15

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DKVC_LOG_LEVEL=2
    -Wall
    -Wextra

build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1

upload_speed = 921600
