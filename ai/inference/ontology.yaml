annotation_rules:
  negative_image: "Ảnh không có lớp mục tiêu giữ annotation rỗng; không tạo class background."
  occluded: "Ghi metadata/tag occluded khi đối tượng bị che khuất đáng kể; vẫn gán class nếu nhận dạng được."
  truncated: "Ghi metadata/tag truncated khi đối tượng bị cắt ở mép ảnh."
  reflection: "Không gán phản chiếu như đối tượng thứ hai."
  uncertain: "Ca không đủ bằng chứng đưa vào review_queue, không đoán nhãn."
  drowning: "Không dùng lớp drowning/needs_rescue chỉ từ một ảnh; cần xác minh vận hành riêng."

compatibility_note: "Source adapter hiện ánh xạ class 0 -> wire candidate 1 và class 1 -> wire candidate 2. Telemetry length, Flags bits, serializer và tương thích FPGA/MCU vẫn là DESIGN_PENDING_G1_ABI; không dùng file này làm bằng chứng hardware contract đã khóa."
