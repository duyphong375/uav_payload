; PlatformIO Project Configuration File for KVC Ground Gateway ESP32-C3
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Serial Monitor Baudrate
monitor_speed = 115200

; Build flags & options cho ESP32-C3 RISC-V
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    ; Mở cờ bên dưới nếu bo ESP32-C3 dùng cổng Type-C USB-CDC trực tiếp (không qua chip CH340/CP2102)
    ; -D ARDUINO_USB_MODE=1
    ; -D ARDUINO_USB_CDC_ON_BOOT=1

; Required Libraries for LoRa and WebSocket
lib_deps = 
    ; Thư viện điều khiển LoRa SX1278 (Ra-02 qua SPI)
    sandeepmistry/LoRa @ ^0.8.0
    ; Thư viện WebSocket Server cho ESP32
    links2004/WebSockets @ ^2.4.1
    ; Thư viện JSON hỗ trợ đóng gói bản tin
    bblanchon/ArduinoJson @ ^7.0.4
